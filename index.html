<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#9E1A26">
<title>Obom Pet Check</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Obom Pet Check">
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
:root{
  --red-deep:#8E1420;
  --red:#9E1A26;
  --red-bright:#C22A34;
  --steel:#6B7280;
  --steel-light:#E7E6E4;
  --paper:#FBFAF8;
  --ink:#241B17;
  --ink-soft:#6B5F5A;
  --ok:#1E8A4C;
  --ok-bg:#E4F5EA;
  --no:#C22A34;
  --no-bg:#FCE7E8;
  --pending:#B8B2AC;
  --radius:14px;
  --shadow: 0 1px 2px rgba(36,27,23,.06), 0 6px 20px -8px rgba(36,27,23,.18);
  --font-display: 'Barlow Condensed', 'Arial Narrow', sans-serif;
  --font-body: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;}
body{
  font-family:var(--font-body);
  background:
    linear-gradient(180deg, var(--red-deep) 0px, var(--red-deep) 210px, var(--paper) 210px);
  color:var(--ink);
  min-height:100vh;
  padding-bottom:100px;
}
@font-face{
  font-family:'Barlow Condensed';
  src:local('Arial Narrow Bold');
}
.brandbar{
  padding:22px 18px 10px;
  display:flex; align-items:center; justify-content:space-between;
  gap:12px;
}
.brand{
  display:flex; align-items:center; gap:10px;
}
.brand-mark{
  width:42px;height:42px;border-radius:11px;
  background:#fff;
  display:flex;align-items:center;justify-content:center;
  box-shadow:var(--shadow);
  flex-shrink:0;
}
.brand-mark svg{width:26px;height:26px;}
.brand-text{color:#fff;}
.brand-text .top{
  font-family:var(--font-display);
  font-weight:800; letter-spacing:.5px;
  font-size:22px; line-height:1;
  text-transform:uppercase;
}
.brand-text .sub{
  font-size:11px; letter-spacing:1.5px; text-transform:uppercase;
  opacity:.78; margin-top:3px;
}
.progress-ring{
  width:52px;height:52px; position:relative; flex-shrink:0;
}
.progress-ring svg{transform:rotate(-90deg); width:100%;height:100%;}
.progress-ring .bg{fill:none; stroke:rgba(255,255,255,.25); stroke-width:5;}
.progress-ring .fg{fill:none; stroke:#fff; stroke-width:5; stroke-linecap:round; transition:stroke-dashoffset .3s;}
.progress-ring .label{
  position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
  color:#fff; font-family:var(--font-display); font-weight:700; font-size:14px;
}

.card{
  background:#fff;
  border-radius:var(--radius);
  box-shadow:var(--shadow);
  margin:0 14px 14px;
  overflow:hidden;
}
.meta-card{padding:16px 16px 6px;}
.meta-title{
  font-family:var(--font-display); text-transform:uppercase; letter-spacing:.5px;
  font-size:13px; color:var(--red); font-weight:700; margin:0 0 12px;
  display:flex; align-items:center; gap:6px;
}
.field-grid{
  display:grid; grid-template-columns:1fr 1fr; gap:10px 12px; margin-bottom:10px;
}
.field-grid.wide{grid-template-columns:1fr;}
.field{display:flex; flex-direction:column; gap:5px;}
.field label{
  font-size:10.5px; text-transform:uppercase; letter-spacing:.6px;
  color:var(--ink-soft); font-weight:600;
}
.field input, .field select{
  border:1.5px solid var(--steel-light);
  border-radius:9px;
  padding:9px 10px;
  font-size:15px;
  font-family:var(--font-body);
  color:var(--ink);
  background:var(--paper);
  width:100%;
}
.field input:focus, .field select:focus{
  outline:none; border-color:var(--red);
}
.field input[readonly]{color:var(--ink-soft); background:#F1EFEC;}
.field select{appearance:none; -webkit-appearance:none;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6'><path d='M0 0 L5 6 L10 0 Z' fill='%236B7280'/></svg>");
  background-repeat:no-repeat; background-position:right 12px center;
}

.section-head{
  background:linear-gradient(90deg, var(--red) 0%, var(--red-bright) 100%);
  color:#fff;
  padding:11px 16px;
  font-family:var(--font-display);
  text-transform:uppercase;
  letter-spacing:.4px;
  font-weight:700;
  font-size:14px;
  display:flex; align-items:center; justify-content:space-between;
}
.section-head .count{
  font-family:var(--font-body); font-weight:600; font-size:11.5px;
  background:rgba(255,255,255,.22); padding:2px 9px; border-radius:20px;
}
.items{padding:6px 0;}
.item{
  padding:12px 16px;
  border-bottom:1px solid #F0EEEB;
}
.item:last-child{border-bottom:none;}
.item-row{
  display:flex; align-items:flex-start; gap:12px;
}
.item-text{
  flex:1; font-size:14.5px; line-height:1.35; padding-top:4px; color:var(--ink);
}
.toggle-group{
  display:flex; gap:6px; flex-shrink:0;
}
.tbtn{
  width:38px; height:38px; border-radius:10px;
  border:1.6px solid var(--steel-light);
  background:#fff;
  display:flex; align-items:center; justify-content:center;
  font-size:17px; cursor:pointer; color:var(--pending);
  transition:transform .12s ease, background .15s, border-color .15s, color .15s;
  user-select:none;
}
.tbtn:active{transform:scale(.9);}
.tbtn.ok.active{background:var(--ok-bg); border-color:var(--ok); color:var(--ok);}
.tbtn.no.active{background:var(--no-bg); border-color:var(--no); color:var(--no);}
.just-wrap{
  margin-top:9px; max-height:0; opacity:0; overflow:hidden;
  transition:max-height .25s ease, opacity .2s ease, margin-top .25s ease;
}
.just-wrap.open{max-height:120px; opacity:1;}
.just-wrap textarea{
  width:100%; border:1.5px solid var(--no); border-radius:9px;
  background:var(--no-bg); padding:9px 10px; font-size:13.5px;
  font-family:var(--font-body); color:var(--ink); resize:none;
  min-height:52px;
}
.just-wrap textarea::placeholder{color:#B87078;}
.just-label{
  font-size:10.5px; color:var(--no); font-weight:700; text-transform:uppercase;
  letter-spacing:.4px; margin-bottom:5px; display:block;
}

.obs-card textarea{
  width:100%; min-height:80px; border:1.5px solid var(--steel-light);
  border-radius:9px; padding:10px; font-size:14px; font-family:var(--font-body);
  background:var(--paper); resize:vertical; color:var(--ink);
}

.footer-bar{
  position:fixed; left:0; right:0; bottom:0;
  background:#fff; border-top:1px solid #EEE;
  padding:10px 14px calc(12px + env(safe-area-inset-bottom));
  display:flex; gap:10px; align-items:center;
  box-shadow:0 -6px 20px -6px rgba(0,0,0,.12);
  z-index:20;
}
.footer-status{
  flex:1; font-size:12px; color:var(--ink-soft); line-height:1.3;
}
.footer-status strong{color:var(--ink); font-family:var(--font-display); font-size:13px;}
.btn{
  border:none; border-radius:11px; padding:13px 18px;
  font-family:var(--font-display); font-weight:700; text-transform:uppercase;
  letter-spacing:.4px; font-size:14px; cursor:pointer;
  display:flex; align-items:center; gap:8px;
}
.btn-primary{
  background:linear-gradient(135deg, var(--red-bright), var(--red-deep));
  color:#fff; box-shadow:0 6px 16px -4px rgba(158,26,38,.55);
}
.btn-primary:active{transform:translateY(1px);}
.btn-primary:disabled{opacity:.45; box-shadow:none;}

.toast{
  position:fixed; left:50%; bottom:96px; transform:translateX(-50%) translateY(20px);
  background:var(--ink); color:#fff; padding:10px 18px; border-radius:30px;
  font-size:13px; opacity:0; transition:opacity .25s, transform .25s; z-index:50;
  pointer-events:none; white-space:nowrap;
}
.toast.show{opacity:1; transform:translateX(-50%) translateY(0);}

.install-banner{
  margin:0 14px 14px; background:#fff; border:1.5px dashed var(--red);
  border-radius:var(--radius); padding:12px 14px; display:none;
  align-items:center; gap:10px; font-size:12.5px; color:var(--ink-soft);
}
.install-banner.show{display:flex;}
.install-banner button{
  background:var(--red); color:#fff; border:none; border-radius:8px;
  padding:8px 12px; font-size:12px; font-weight:700; flex-shrink:0;
  font-family:var(--font-display); text-transform:uppercase;
}

.top-actions{
  display:flex; gap:8px; padding:0 14px 12px; margin-top:-4px;
}
.chip-btn{
  flex:1; background:#fff; border:1.5px solid var(--steel-light); border-radius:10px;
  padding:9px 6px; font-size:11.5px; color:var(--ink-soft); font-weight:600;
  display:flex; flex-direction:column; align-items:center; gap:3px; cursor:pointer;
}
.chip-btn span.n{font-size:16px;}

.sign-overlay{
  position:fixed; inset:0; background:rgba(36,27,23,.55);
  display:none; align-items:flex-end; justify-content:center;
  z-index:100; backdrop-filter:blur(1px);
}
.sign-overlay.show{display:flex;}
.sign-modal{
  background:#fff; width:100%; max-width:520px;
  border-radius:20px 20px 0 0;
  padding:18px 18px calc(16px + env(safe-area-inset-bottom));
  box-shadow:0 -10px 30px -6px rgba(0,0,0,.3);
  animation:signUp .25s ease;
}
@keyframes signUp{
  from{transform:translateY(30px); opacity:0;}
  to{transform:translateY(0); opacity:1;}
}
.sign-head{
  display:flex; align-items:flex-start; justify-content:space-between; gap:10px; margin-bottom:12px;
}
.sign-title{
  font-family:var(--font-display); text-transform:uppercase; letter-spacing:.4px;
  font-weight:700; font-size:16px; color:var(--red);
}
.sign-sub{font-size:12px; color:var(--ink-soft); margin-top:3px;}
.sign-close{
  background:var(--steel-light); border:none; border-radius:50%;
  width:30px; height:30px; flex-shrink:0; font-size:14px; color:var(--ink-soft); cursor:pointer;
}
.sign-pad-wrap{
  position:relative; border:1.8px dashed var(--steel-light); border-radius:12px;
  background:var(--paper); overflow:hidden; touch-action:none;
}
#signCanvas{
  display:block; width:100%; height:200px; touch-action:none;
}
.sign-line-hint{
  position:absolute; left:16px; right:16px; bottom:34px;
  border-top:1.5px solid #D8D3CE; pointer-events:none;
}
.sign-name-field{
  margin-top:12px; display:flex; flex-direction:column; gap:5px;
}
.sign-name-field label{
  font-size:10.5px; text-transform:uppercase; letter-spacing:.6px;
  color:var(--ink-soft); font-weight:600;
}
.sign-name-field input{
  border:1.5px solid var(--steel-light); border-radius:9px; padding:10px;
  font-size:15px; font-family:var(--font-body); color:var(--ink); background:var(--paper);
}
.sign-name-field input:focus{outline:none; border-color:var(--red);}
.sign-actions{
  display:flex; gap:10px; margin-top:16px;
}
.btn-ghost{
  background:#fff; color:var(--ink-soft); border:1.5px solid var(--steel-light);
  flex:0 0 auto;
}
.sign-actions .btn-primary{flex:1; justify-content:center;}
</style>
</head>
<body>

<div class="brandbar">
  <div class="brand">
    <div class="brand-mark">
      <svg viewBox="0 0 24 24" fill="none"><path d="M4 12.5L9.5 18L20 6" stroke="#9E1A26" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </div>
    <div class="brand-text">
      <div class="top">Obom Pet</div>
      <div class="sub">Check &middot; Rotina Diária</div>
    </div>
  </div>
  <div class="progress-ring">
    <svg viewBox="0 0 52 52">
      <circle class="bg" cx="26" cy="26" r="22"></circle>
      <circle class="fg" id="ringFg" cx="26" cy="26" r="22" stroke-dasharray="138" stroke-dashoffset="138"></circle>
    </svg>
    <div class="label" id="ringLabel">0%</div>
  </div>
</div>

<div class="card meta-card">
  <div class="meta-title">📋 Dados do Checklist</div>
  <div class="field-grid">
    <div class="field">
      <label>Data</label>
      <input type="text" id="fData" readonly>
    </div>
    <div class="field">
      <label>Loja / Unidade</label>
      <select id="fLoja">
        <option value="">Selecione...</option>
        <option>Agulhas Negras</option>
        <option>Ilha de Guaratiba</option>
        <option>Pedra de Guaratiba</option>
        <option>Vargem Grande</option>
      </select>
    </div>
  </div>
  <div class="field-grid">
    <div class="field">
      <label>Meta Dia (R$)</label>
      <input type="text" inputmode="decimal" id="fMetaDia" placeholder="0,00">
    </div>
    <div class="field">
      <label>Meta TKM (R$)</label>
      <input type="text" inputmode="decimal" id="fMetaTkm" placeholder="0,00">
    </div>
  </div>
  <div class="field-grid wide">
    <div class="field">
      <label>Meta Mês (R$)</label>
      <input type="text" inputmode="decimal" id="fMetaMes" placeholder="0,00">
    </div>
  </div>
</div>

<div id="sections"></div>

<div class="card obs-card meta-card">
  <div class="meta-title">📝 Observações e Ocorrências Gerais</div>
  <textarea id="obsGeral" placeholder="Registre aqui observações gerais do dia..."></textarea>
</div>

<div class="install-banner" id="installBanner">
  <span>📲 Instale o Obom Pet Check na tela inicial do celular para acesso rápido.</span>
  <button id="installBtn">Instalar</button>
</div>

<div class="toast" id="toast"></div>

<div class="sign-overlay" id="signOverlay">
  <div class="sign-modal">
    <div class="sign-head">
      <div>
        <div class="sign-title">Assinatura do Responsável</div>
        <div class="sign-sub">Assine com o dedo para confirmar o envio do check</div>
      </div>
      <button class="sign-close" id="signClose" aria-label="Fechar">✕</button>
    </div>
    <div class="sign-pad-wrap">
      <canvas id="signCanvas"></canvas>
      <div class="sign-line-hint">Assine acima</div>
    </div>
    <div class="sign-name-field">
      <label>Nome do responsável</label>
      <input type="text" id="signName" placeholder="Digite o nome completo">
    </div>
    <div class="sign-actions">
      <button class="btn btn-ghost" id="signClear">Limpar</button>
      <button class="btn btn-primary" id="signConfirm">Confirmar e Enviar</button>
    </div>
  </div>
</div>

<div class="footer-bar">
  <div class="footer-status">
    <strong id="doneCount">0/0</strong> tarefas registradas
  </div>
  <button class="btn btn-primary" id="btnPdf">✅ Enviar Check</button>
</div>

<script>
const CHECKLIST = [
  {
    title: "1. Abertura e Alinhamento de Metas",
    items: [
      "Ronda diária na loja",
      "Reunião rápida com a equipe",
      "Passar direcionamento do dia",
      "Alinhar meta de faturamento e TKM",
      "Apresentar como estamos no mês",
      "Informar quanto falta para a meta",
      "Definir como atingir o resultado",
      "Distribuir tarefas e prioridades"
    ]
  },
  {
    title: "2. Acompanhamento e Operação de Loja",
    items: [
      "Acompanhar vendas individuais",
      "Acompanhar TKM individual",
      "Acompanhar postura da equipe",
      "Verificar organização da loja",
      "Verificar estoque, preços e validade",
      "Corrigir erros imediatamente",
      "Dar feedbacks e reconhecer"
    ]
  },
  {
    title: "3. Gestão de Pessoas e Fechamento Diário",
    items: [
      "Acompanhar processos e garantir cumprimento das regras",
      "Resolver problemas e conflitos",
      "Dar retorno à gestão sobre ocorrências e resultados",
      "Fechar o dia analisando resultado x meta"
    ]
  }
];

let state = {}; // key `${si}-${ii}` -> {status:'ok'|'no'|null, obs:''}

function todayStr(){
  const d = new Date();
  const dd = String(d.getDate()).padStart(2,'0');
  const mm = String(d.getMonth()+1).padStart(2,'0');
  const yyyy = d.getFullYear();
  return `${dd}/${mm}/${yyyy}`;
}

function buildSections(){
  const root = document.getElementById('sections');
  root.innerHTML = '';
  CHECKLIST.forEach((sec, si)=>{
    const card = document.createElement('div');
    card.className = 'card';
    const head = document.createElement('div');
    head.className = 'section-head';
    head.innerHTML = `<span>${sec.title}</span><span class="count" id="cnt-${si}">0/${sec.items.length}</span>`;
    card.appendChild(head);
    const list = document.createElement('div');
    list.className = 'items';
    sec.items.forEach((text, ii)=>{
      const key = `${si}-${ii}`;
      state[key] = {status:null, obs:''};
      const item = document.createElement('div');
      item.className = 'item';
      item.innerHTML = `
        <div class="item-row">
          <div class="item-text">${text}</div>
          <div class="toggle-group">
            <div class="tbtn ok" data-key="${key}" data-val="ok">✓</div>
            <div class="tbtn no" data-key="${key}" data-val="no">✕</div>
          </div>
        </div>
        <div class="just-wrap" id="just-${key}">
          <span class="just-label">Motivo da não realização</span>
          <textarea placeholder="Justifique aqui por que não foi realizado..." data-key="${key}"></textarea>
        </div>
      `;
      list.appendChild(item);
    });
    card.appendChild(list);
    root.appendChild(card);
  });

  root.querySelectorAll('.tbtn').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      const key = btn.dataset.key;
      const val = btn.dataset.val;
      const cur = state[key].status;
      const newVal = (cur === val) ? null : val;
      state[key].status = newVal;
      refreshItem(key);
      updateProgress();
    });
  });
  root.querySelectorAll('.just-wrap textarea').forEach(ta=>{
    ta.addEventListener('input', ()=>{
      state[ta.dataset.key].obs = ta.value;
    });
  });
}

function refreshItem(key){
  const wrap = document.querySelector(`.item .toggle-group [data-key="${key}"]`).closest('.item');
  const okBtn = wrap.querySelector('.tbtn.ok');
  const noBtn = wrap.querySelector('.tbtn.no');
  const justWrap = wrap.querySelector('.just-wrap');
  const st = state[key].status;
  okBtn.classList.toggle('active', st==='ok');
  noBtn.classList.toggle('active', st==='no');
  justWrap.classList.toggle('open', st==='no');
}

function updateProgress(){
  const keys = Object.keys(state);
  const total = keys.length;
  const done = keys.filter(k=>state[k].status).length;
  const pct = total ? Math.round(done/total*100) : 0;

  document.getElementById('doneCount').textContent = `${done}/${total}`;
  const ring = document.getElementById('ringFg');
  const circumference = 138;
  ring.style.strokeDashoffset = circumference - (circumference*pct/100);
  document.getElementById('ringLabel').textContent = pct+'%';

  CHECKLIST.forEach((sec,si)=>{
    const secDone = sec.items.filter((_,ii)=> state[`${si}-${ii}`].status).length;
    const el = document.getElementById(`cnt-${si}`);
    if(el) el.textContent = `${secDone}/${sec.items.length}`;
  });
}

function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 2400);
}

async function gerarPDF(signatureData, signerName){
  const loja = document.getElementById('fLoja').value;
  if(!loja){
    showToast('Selecione a loja antes de gerar o relatório');
    document.getElementById('fLoja').focus();
    return;
  }
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({unit:'pt', format:'a4'});
  const pageW = doc.internal.pageSize.getWidth();
  const marginX = 40;
  let y = 50;

  const red = [158,26,38];
  const dark = [36,27,23];
  const gray = [107,95,90];

  // Header
  doc.setFillColor(...red);
  doc.rect(0,0,pageW,74,'F');
  doc.setTextColor(255,255,255);
  doc.setFont('helvetica','bold');
  doc.setFontSize(19);
  doc.text('OBOM PET CHECK', marginX, 34);
  doc.setFontSize(10.5);
  doc.setFont('helvetica','normal');
  doc.text('Checklist Operacional - Rotina Diária', marginX, 52);

  doc.setFontSize(10);
  doc.text(`Data: ${document.getElementById('fData').value}`, pageW-marginX, 30, {align:'right'});
  doc.text(`Loja: ${loja}`, pageW-marginX, 44, {align:'right'});

  y = 96;
  doc.setTextColor(...dark);
  doc.setFontSize(10.5);
  doc.setFont('helvetica','bold');
  const metaDia = document.getElementById('fMetaDia').value || '-';
  const metaTkm = document.getElementById('fMetaTkm').value || '-';
  const metaMes = document.getElementById('fMetaMes').value || '-';
  doc.text(`Meta Dia: R$ ${metaDia}    Meta TKM: R$ ${metaTkm}    Meta Mês: R$ ${metaMes}`, marginX, y);
  y += 20;

  const keys = Object.keys(state);
  const total = keys.length;
  const done = keys.filter(k=>state[k].status==='ok').length;
  const naoFeitas = keys.filter(k=>state[k].status==='no').length;
  const pendentes = total - done - naoFeitas;

  doc.setFont('helvetica','normal');
  doc.setFontSize(10);
  doc.setTextColor(...gray);
  doc.text(`Resumo: ${done} concluídas   |   ${naoFeitas} não realizadas   |   ${pendentes} pendentes   |   Total ${total} tarefas`, marginX, y);
  y += 18;

  function checkPageBreak(extra){
    if(y + extra > 780){
      doc.addPage();
      y = 50;
    }
  }

  CHECKLIST.forEach((sec, si)=>{
    checkPageBreak(40);
    doc.setFillColor(...red);
    doc.rect(marginX-6, y-14, pageW-2*(marginX-6), 22, 'F');
    doc.setTextColor(255,255,255);
    doc.setFont('helvetica','bold');
    doc.setFontSize(10.5);
    doc.text(sec.title.toUpperCase(), marginX, y+1);
    y += 24;

    sec.items.forEach((text, ii)=>{
      const key = `${si}-${ii}`;
      const st = state[key].status;
      const label = st==='ok' ? 'OK' : (st==='no' ? 'NÃO REALIZADO' : 'PENDENTE');
      const color = st==='ok' ? [30,138,76] : (st==='no' ? [194,42,52] : [184,178,172]);

      checkPageBreak(28);
      doc.setFont('helvetica','normal');
      doc.setFontSize(10.5);
      doc.setTextColor(...dark);
      const wrapped = doc.splitTextToSize(text, pageW - 2*marginX - 110);
      doc.text(wrapped, marginX, y);

      doc.setFont('helvetica','bold');
      doc.setFontSize(9);
      doc.setTextColor(...color);
      doc.text(label, pageW - marginX, y, {align:'right'});

      y += 14*wrapped.length;

      if(st==='no' && state[key].obs){
        checkPageBreak(24);
        doc.setFont('helvetica','italic');
        doc.setFontSize(9);
        doc.setTextColor(...gray);
        const obsWrapped = doc.splitTextToSize(`Justificativa: ${state[key].obs}`, pageW - 2*marginX - 10);
        doc.text(obsWrapped, marginX+8, y);
        y += 12*obsWrapped.length + 2;
      }
      y += 6;
    });
    y += 6;
  });

  const obsGeral = document.getElementById('obsGeral').value.trim();
  checkPageBreak(60);
  doc.setFillColor(...red);
  doc.rect(marginX-6, y-14, pageW-2*(marginX-6), 22, 'F');
  doc.setTextColor(255,255,255);
  doc.setFont('helvetica','bold');
  doc.setFontSize(10.5);
  doc.text('OBSERVAÇÕES E OCORRÊNCIAS GERAIS', marginX, y+1);
  y += 24;
  doc.setFont('helvetica','normal');
  doc.setFontSize(10);
  doc.setTextColor(...dark);
  const obsW = doc.splitTextToSize(obsGeral || 'Nenhuma observação registrada.', pageW - 2*marginX);
  doc.text(obsW, marginX, y);
  y += 14*obsW.length + 20;

  checkPageBreak(90);
  const sigBoxW = 180;
  if(signatureData){
    try{
      doc.addImage(signatureData, 'PNG', marginX, y-16, sigBoxW, 45, undefined, 'FAST');
    }catch(e){ /* ignore image errors, still draw the line */ }
  }
  doc.setDrawColor(...gray);
  doc.line(marginX, y+30, marginX+sigBoxW, y+30);
  doc.line(pageW-marginX-sigBoxW, y+30, pageW-marginX, y+30);
  doc.setFontSize(9);
  doc.setTextColor(...gray);
  doc.text(signerName ? signerName : 'Responsável', marginX, y+42);
  doc.setFont('helvetica','normal');
  doc.setFontSize(8);
  doc.text('Assinatura do Responsável', marginX, y+52);
  doc.setFontSize(9);
  doc.text('Gestão', pageW-marginX-sigBoxW, y+42);

  const fname = `Checklist_ObomPet_${loja.replace(/\s+/g,'')}_${document.getElementById('fData').value.replace(/\//g,'-')}.pdf`;
  return {doc, fname};
}

// ---------- Signature pad ----------
const signCanvas = document.getElementById('signCanvas');
const signCtx = signCanvas.getContext('2d');
let signing = false;
let hasSignature = false;
let lastPt = null;

function resizeSignCanvas(){
  const rect = signCanvas.getBoundingClientRect();
  const ratio = window.devicePixelRatio || 1;
  const prevData = hasSignature ? signCanvas.toDataURL() : null;
  signCanvas.width = rect.width * ratio;
  signCanvas.height = rect.height * ratio;
  signCtx.setTransform(1,0,0,1,0,0);
  signCtx.scale(ratio, ratio);
  signCtx.lineWidth = 2.4;
  signCtx.lineCap = 'round';
  signCtx.lineJoin = 'round';
  signCtx.strokeStyle = '#241B17';
  if(prevData){
    const img = new Image();
    img.onload = ()=> signCtx.drawImage(img, 0, 0, rect.width, rect.height);
    img.src = prevData;
  }
}

function getPos(evt){
  const rect = signCanvas.getBoundingClientRect();
  const point = evt.touches ? evt.touches[0] : evt;
  return { x: point.clientX - rect.left, y: point.clientY - rect.top };
}

function startSign(evt){
  evt.preventDefault();
  signing = true;
  hasSignature = true;
  lastPt = getPos(evt);
}
function moveSign(evt){
  if(!signing) return;
  evt.preventDefault();
  const p = getPos(evt);
  signCtx.beginPath();
  signCtx.moveTo(lastPt.x, lastPt.y);
  signCtx.lineTo(p.x, p.y);
  signCtx.stroke();
  lastPt = p;
}
function endSign(evt){
  if(evt) evt.preventDefault();
  signing = false;
  lastPt = null;
}

signCanvas.addEventListener('mousedown', startSign);
signCanvas.addEventListener('mousemove', moveSign);
window.addEventListener('mouseup', endSign);
signCanvas.addEventListener('touchstart', startSign, {passive:false});
signCanvas.addEventListener('touchmove', moveSign, {passive:false});
signCanvas.addEventListener('touchend', endSign);

function clearSignCanvas(){
  const rect = signCanvas.getBoundingClientRect();
  signCtx.clearRect(0,0,rect.width,rect.height);
  hasSignature = false;
}

function openSignModal(){
  const loja = document.getElementById('fLoja').value;
  if(!loja){
    showToast('Selecione a loja antes de enviar o check');
    document.getElementById('fLoja').focus();
    return;
  }
  document.getElementById('signOverlay').classList.add('show');
  requestAnimationFrame(()=>{
    resizeSignCanvas();
  });
}
function closeSignModal(){
  document.getElementById('signOverlay').classList.remove('show');
}

document.getElementById('signClose').addEventListener('click', closeSignModal);
document.getElementById('signOverlay').addEventListener('click', (e)=>{
  if(e.target.id === 'signOverlay') closeSignModal();
});
document.getElementById('signClear').addEventListener('click', clearSignCanvas);
window.addEventListener('resize', ()=>{
  if(document.getElementById('signOverlay').classList.contains('show')) resizeSignCanvas();
});

document.getElementById('signConfirm').addEventListener('click', async ()=>{
  if(!hasSignature){
    showToast('Assine no campo indicado antes de confirmar');
    return;
  }
  const signerName = document.getElementById('signName').value.trim();
  const signatureData = signCanvas.toDataURL('image/png');

  const confirmBtn = document.getElementById('signConfirm');
  confirmBtn.disabled = true;
  confirmBtn.textContent = 'Enviando...';

  try{
    const result = await gerarPDF(signatureData, signerName);
    if(!result){ confirmBtn.disabled=false; confirmBtn.textContent='Confirmar e Enviar'; return; }
    const {doc, fname} = result;
    const blob = doc.output('blob');
    const file = new File([blob], fname, {type:'application/pdf'});

    if(navigator.canShare && navigator.canShare({files:[file]})){
      try{
        await navigator.share({
          files:[file],
          title:'Obom Pet Check',
          text:`Checklist Operacional - ${document.getElementById('fLoja').value} - ${document.getElementById('fData').value}`
        });
        showToast('Check enviado com sucesso!');
      }catch(e){
        doc.save(fname);
      }
    } else {
      doc.save(fname);
      showToast('PDF baixado. Abra o WhatsApp e anexe o arquivo.');
    }
    closeSignModal();
    clearSignCanvas();
    document.getElementById('signName').value = '';
  }catch(err){
    console.error(err);
    showToast('Erro ao gerar PDF. Tente novamente.');
  }
  confirmBtn.disabled = false;
  confirmBtn.textContent = 'Confirmar e Enviar';
});

document.getElementById('btnPdf').addEventListener('click', openSignModal);

// init
document.getElementById('fData').value = todayStr();
buildSections();
updateProgress();

// PWA install prompt
let deferredPrompt;
window.addEventListener('beforeinstallprompt', (e)=>{
  e.preventDefault();
  deferredPrompt = e;
  document.getElementById('installBanner').classList.add('show');
});
document.getElementById('installBtn').addEventListener('click', async ()=>{
  document.getElementById('installBanner').classList.remove('show');
  if(deferredPrompt){
    deferredPrompt.prompt();
    await deferredPrompt.userChoice;
    deferredPrompt = null;
  }
});

// register service worker
if('serviceWorker' in navigator){
  window.addEventListener('load', ()=>{
    navigator.serviceWorker.register('service-worker.js').catch(()=>{});
  });
}
</script>
